# Builds Infly for iPhone (unsigned .ipa) and Mac (Mac Catalyst .zip) on a GitHub-hosted Mac,
# publishes both on the "latest" release, then runs the unit tests.
# Install the IPA with a sideloading tool such as Sideloadly, which signs it with your Apple ID.
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write # publishes the "latest" release

env:
  # Bundle IDs become <prefix>.infly and <prefix>.infly.widgets; the App Group is group.<prefix>.infly.
  BUNDLE_PREFIX: com.leobruzual

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build -project Infly.xcodeproj -scheme Infly -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            INFLY_BUNDLE_ID_PREFIX="$BUNDLE_PREFIX" CODE_SIGNING_ALLOWED=NO

      - name: Package Infly.ipa
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Infly.app"
          # An ad-hoc signature that carries the App Group, so re-signing tools know to keep it.
          cat > "$RUNNER_TEMP/entitlements.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.$BUNDLE_PREFIX.infly</string></array>
          </dict></plist>
          EOF
          codesign --force --sign - --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP/PlugIns/InflyWidgetsExtension.appex"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry Infly.ipa Payload)
          ls -la build/Infly.ipa

      - name: Build for Mac (Mac Catalyst, unsigned)
        run: |
          xcodebuild build -project Infly.xcodeproj -scheme Infly -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath "$RUNNER_TEMP/dd-mac" \
            INFLY_BUNDLE_ID_PREFIX="$BUNDLE_PREFIX" CODE_SIGNING_ALLOWED=NO

      - name: Package Infly-mac.zip
        run: |
          APP="$RUNNER_TEMP/dd-mac/Build/Products/Release-maccatalyst/Infly.app"
          # macOS only loads sandboxed widget extensions, so both get the sandbox entitlement.
          codesign --force --sign - --entitlements Config/InflyMac.entitlements "$APP/Contents/PlugIns/InflyWidgetsExtension.appex"
          codesign --force --sign - --entitlements Config/InflyMac.entitlements "$APP"
          ditto -c -k --keepParent "$APP" build/Infly-mac.zip
          ls -la build/Infly-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Infly-ipa
          path: build/Infly.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Infly-mac
          path: build/Infly-mac.zip
          retention-days: 14

      - name: Publish both downloads on the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Infly.ipa build/Infly-mac.zip --target "$GITHUB_SHA" \
            --title "Infly (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Infly.ipa installs on iPhone with Sideloadly. Infly-mac.zip is the Mac app: unzip it and move Infly to Applications."

      - name: Run unit tests on an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          xcodebuild test -project Infly.xcodeproj -scheme Infly -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd-test"
